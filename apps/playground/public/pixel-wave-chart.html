<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Wave Chart</title>
    <style>
      :root {
        --text-secondary: #a8a29a;
        --text-muted: #77716a;
        --bg: #111;
        --surface: #161616;
        --border: #2a2a2a;
        --canvas-bg: #1a1a1a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        background: var(--bg);
        color: #e7e5e4;
      }

      .pixel-wave-chart {
        width: min(720px, 100%);
        padding: 16px 16px 12px;
        background: var(--surface);
        border: 2px solid var(--border);
      }

      .pixel-wave-chart__title {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-secondary);
      }

      .pixel-wave-chart__legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 18px;
        margin: 0 0 12px;
        padding: 0;
        list-style: none;
      }

      .pixel-wave-chart__legend-item {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--text-secondary);
      }

      .pixel-wave-chart__swatch {
        width: 10px;
        height: 10px;
        flex: 0 0 auto;
      }

      .pixel-wave-chart__canvas-wrap {
        position: relative;
        width: 100%;
        height: 280px;
        background: var(--canvas-bg);
        border: 1px solid var(--border);
      }

      .pixel-wave-chart__canvas-wrap canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      .pixel-wave-chart__status {
        margin: 10px 0 0;
        font-size: 13px;
        color: var(--text-secondary);
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <div class="pixel-wave-chart">
      <h2 class="pixel-wave-chart__title">Resource load — last 24 hours</h2>
      <ul class="pixel-wave-chart__legend" id="legend" aria-label="Series legend"></ul>
      <div class="pixel-wave-chart__canvas-wrap" id="wrap">
        <canvas
          id="canvas"
          role="img"
          aria-label="Pixel wave chart of CPU and Memory over 24 hours. CPU is a tall midday bell peaking near 80 percent. Memory is a lower jagged band between about 8 and 35 percent."
        >
          CPU rises through the morning, peaks near midday around 80%, then falls. Memory stays
          lower as a jagged band between roughly 8% and 35%.
        </canvas>
      </div>
      <p class="pixel-wave-chart__status" id="status">hover to inspect</p>
    </div>

    <script>
      (() => {
        /**
         * Matching the reference:
         * - Bands = fixed cell thickness measured FROM THE CREST (contour ribbons),
         *   not % of column height (that stretches foam on tall peaks).
         * - Crest jitter = correlated random walk so edges look like soft terrain,
         *   not independent noise spikes.
         * - Opaque layering, dark canvas, whole-pixel cells only.
         */
        const PIXEL = 9;
        const AXIS_H = 22;
        const PAD = { top: 8, right: 8, bottom: AXIS_H, left: 8 };
        const DEFAULT_STATUS = 'hover to inspect';
        const CANVAS_BG = '#1a1a1a';

        // Absolute rows-from-crest → band index (6 HSL-derived contour ribbons).
        function bandIndexFromCrestRow(row) {
          if (row < 2) return 0;
          if (row < 4) return 1;
          if (row < 7) return 2;
          if (row < 11) return 3;
          if (row < 16) return 4;
          return 5;
        }

        function bandsFromHue(hue) {
          const h = ((hue % 360) + 360) % 360;
          const lightStart = 88;
          const lightEnd = 22;
          const satStart = 38;
          const satEnd = 76;
          return Array.from({ length: 6 }, (_, i) => {
            const t = i / 5;
            const l = lightStart + (lightEnd - lightStart) * t;
            const s = satStart + (satEnd - satStart) * t;
            return `hsl(${Math.round(h)} ${Math.round(s)}% ${Math.round(l)}%)`;
          });
        }

        function makeRng(seed) {
          let s = seed >>> 0;
          return () => {
            s = (Math.imul(1664525, s) + 1013904223) >>> 0;
            return s / 0x100000000;
          };
        }

        function hashString(str) {
          let h = 2166136261;
          for (let i = 0; i < str.length; i += 1) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 16777619);
          }
          return h >>> 0;
        }

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function sampleSeries(values, t) {
          const n = values.length;
          if (n === 0) return 0;
          if (n === 1) return values[0];
          const x = Math.min(Math.max(t, 0), 1) * (n - 1);
          const i = Math.floor(x);
          const j = Math.min(i + 1, n - 1);
          return lerp(values[i], values[j], x - i);
        }

        function snapDown(n) {
          return Math.floor(n / PIXEL) * PIXEL;
        }

        /** Correlated crest walk: neighbors differ by at most 1 cell → soft jagged rim */
        function buildCrestJitter(cols, seed, amplitude) {
          const rng = makeRng(seed);
          const out = new Array(cols);
          let v = 0;
          for (let c = 0; c < cols; c += 1) {
            const r = rng();
            const step = r < 0.28 ? -1 : r < 0.56 ? 1 : 0;
            v = Math.max(-amplitude, Math.min(amplitude, v + step));
            // occasional extra bump for "sandier" foreground series
            if (amplitude >= 2 && rng() < 0.12) {
              v = Math.max(-amplitude, Math.min(amplitude, v + (rng() < 0.5 ? -1 : 1)));
            }
            out[c] = v;
          }
          return out;
        }

        function buildHours(count) {
          return Array.from({ length: count }, (_, i) => `${String(i).padStart(2, '0')}:00`);
        }

        function bellCpu(i, n) {
          const t = i / (n - 1);
          const peak = Math.exp(-(((t - 0.5) / 0.2) ** 2));
          const skirts = 8 + 4 * Math.sin(t * Math.PI);
          return Math.round(skirts + peak * 72);
        }

        function driftMemory(i, n) {
          const t = i / (n - 1);
          // Low plateau with light oscillation — size contrast vs CPU
          return Math.round(
            14 + 6 * t + 4.5 * Math.sin(t * Math.PI * 7) + 2 * Math.sin(t * Math.PI * 15),
          );
        }

        const HOURS = 24;
        const labels = buildHours(HOURS);

        const series = [
          {
            name: 'CPU',
            values: Array.from({ length: HOURS }, (_, i) => bellCpu(i, HOURS)),
            bands: bandsFromHue(198),
            seed: hashString('CPU-wave'),
            jitterAmp: 1,
          },
          {
            name: 'Memory',
            values: Array.from({ length: HOURS }, (_, i) => driftMemory(i, HOURS)),
            bands: bandsFromHue(32),
            seed: hashString('Memory-wave'),
            jitterAmp: 2,
          },
        ];

        const drawOrder = [...series].sort((a, b) => {
          const span = (s) => Math.max(...s.values) - Math.min(...s.values);
          return span(b) - span(a);
        });

        const wrap = document.getElementById('wrap');
        const canvas = document.getElementById('canvas');
        const statusEl = document.getElementById('status');
        const legend = document.getElementById('legend');
        const ctx = canvas.getContext('2d');

        let hoverIndex = -1;
        let layout = null;

        function renderLegend() {
          legend.innerHTML = '';
          for (const s of series) {
            const li = document.createElement('li');
            li.className = 'pixel-wave-chart__legend-item';
            const swatch = document.createElement('span');
            swatch.className = 'pixel-wave-chart__swatch';
            swatch.style.background = s.bands[5];
            const name = document.createElement('span');
            name.textContent = s.name;
            li.append(swatch, name);
            legend.appendChild(li);
          }
        }

        function computeLayout() {
          const cssW = wrap.clientWidth;
          const cssH = wrap.clientHeight;
          const plotW = Math.max(PIXEL, snapDown(cssW - PAD.left - PAD.right));
          const plotH = Math.max(PIXEL, snapDown(cssH - PAD.top - PAD.bottom));
          const cols = Math.max(1, Math.floor(plotW / PIXEL));
          const maxValue = Math.max(...series.flatMap((s) => s.values), 1);
          const maxCells = plotH / PIXEL;

          const jitterMaps = Object.fromEntries(
            series.map((s) => [s.name, buildCrestJitter(cols, s.seed, s.jitterAmp)]),
          );

          const columns = [];
          for (let c = 0; c < cols; c += 1) {
            const t = cols === 1 ? 0 : c / (cols - 1);
            const dataIndex = Math.round(t * (HOURS - 1));
            const col = {
              x: PAD.left + c * PIXEL,
              dataIndex,
              topY: {},
              cellCount: {},
            };

            for (const s of series) {
              const value = sampleSeries(s.values, t);
              const baseCells = Math.max(1, Math.round((value / maxValue) * maxCells));
              const cells = Math.max(1, Math.min(maxCells, baseCells + jitterMaps[s.name][c]));
              col.cellCount[s.name] = cells;
              col.topY[s.name] = PAD.top + plotH - cells * PIXEL;
            }
            columns.push(col);
          }

          return {
            cssW,
            cssH,
            plotW,
            plotH,
            cols,
            columns,
            baseline: PAD.top + plotH,
          };
        }

        function resizeCanvas(cssW, cssH) {
          const dpr = window.devicePixelRatio || 1;
          canvas.width = Math.max(1, Math.floor(cssW * dpr));
          canvas.height = Math.max(1, Math.floor(cssH * dpr));
          canvas.style.width = `${cssW}px`;
          canvas.style.height = `${cssH}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.imageSmoothingEnabled = false;
        }

        function drawAxis(L) {
          ctx.save();
          ctx.globalAlpha = 1;
          ctx.fillStyle = '#77716a';
          ctx.font = '10px ui-sans-serif, system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';

          const tickEvery = 6;
          for (let i = 0; i < labels.length; i += tickEvery) {
            const t = labels.length === 1 ? 0 : i / (labels.length - 1);
            ctx.fillText(labels[i], PAD.left + t * L.plotW, L.baseline + 6);
          }
          const last = labels.length - 1;
          if (last % tickEvery !== 0) {
            ctx.fillText(labels[last], PAD.left + L.plotW, L.baseline + 6);
          }
          ctx.restore();
        }

        function drawSeriesWave(s, L, isBackmost) {
          for (const col of L.columns) {
            const topY = col.topY[s.name];
            const cellCount = col.cellCount[s.name];
            const dim = hoverIndex >= 0 && col.dataIndex !== hoverIndex ? 0.3 : 1;
            ctx.globalAlpha = dim;

            for (let row = 0; row < cellCount; row += 1) {
              const y = topY + row * PIXEL;
              ctx.fillStyle = s.bands[bandIndexFromCrestRow(row)];
              ctx.fillRect(col.x, y, PIXEL, PIXEL);
            }

            // Back-series crest outline so peak stays readable under front wave
            if (isBackmost) {
              ctx.fillStyle = s.bands[2];
              ctx.fillRect(col.x, Math.max(PAD.top, topY - 2), PIXEL, 2);
            }
          }
          ctx.globalAlpha = 1;
        }

        function draw() {
          if (!layout) return;
          const L = layout;
          ctx.globalAlpha = 1;
          ctx.clearRect(0, 0, L.cssW, L.cssH);
          ctx.fillStyle = CANVAS_BG;
          ctx.fillRect(0, 0, L.cssW, L.cssH);

          drawOrder.forEach((s, i) => drawSeriesWave(s, L, i === 0));
          drawAxis(L);
        }

        function rebuild() {
          layout = computeLayout();
          resizeCanvas(layout.cssW, layout.cssH);
          draw();
        }

        function updateStatus(index) {
          if (index < 0) {
            statusEl.textContent = DEFAULT_STATUS;
            return;
          }
          const parts = series.map((s) => `${s.name} ${s.values[index]}%`);
          statusEl.textContent = `${labels[index]} — ${parts.join(', ')}`;
        }

        function indexFromEvent(evt) {
          if (!layout) return -1;
          const rect = canvas.getBoundingClientRect();
          const x = evt.clientX - rect.left;
          if (x < PAD.left || x > PAD.left + layout.plotW) return -1;
          return Math.round(((x - PAD.left) / layout.plotW) * (HOURS - 1));
        }

        canvas.addEventListener('mousemove', (evt) => {
          const next = indexFromEvent(evt);
          if (next === hoverIndex) return;
          hoverIndex = next;
          updateStatus(hoverIndex);
          draw();
        });

        canvas.addEventListener('mouseleave', () => {
          if (hoverIndex === -1) return;
          hoverIndex = -1;
          updateStatus(-1);
          draw();
        });

        renderLegend();
        rebuild();
        new ResizeObserver(() => rebuild()).observe(wrap);
      })();
    </script>
  </body>
</html>
